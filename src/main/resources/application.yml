server:
  port: 8080

spring:
  application:
    name: kestachet

  datasource:
    url: jdbc:h2:mem:kestachetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Profil de production PostgreSQL (activable avec --spring.profiles.active=prod)
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/kestachet_db
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:kestachet}
    password: ${DB_PASSWORD:secret}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
